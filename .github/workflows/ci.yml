name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Runtime dependencies only; dev tools are covered by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - run: npm run build
      # Sends the results to a requirements instance. Off until the repository secrets REQ_URL and REQ_TOKEN exist,
      # and never on pull requests from forks. See docs/user-guide/verification.md.
      - name: Upload results to the requirements tool
        if: always() && env.REQ_URL != '' && env.REQ_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REQ_URL: ${{ secrets.REQ_URL }}
          REQ_TOKEN: ${{ secrets.REQ_TOKEN }}
        run: node scripts/ci/upload-results.ts
