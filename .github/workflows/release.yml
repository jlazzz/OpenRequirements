name: Release
# A version tag publishes the image. See docs/RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Tag, package.json version and CHANGELOG.md must agree.
      - run: node scripts/release/notes.ts "$GITHUB_REF_NAME" release-notes.md
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - run: npm ci
      # Production dependencies only: what the image runs.
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image and attach the SBOM
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json --title "$GITHUB_REF_NAME" --notes-file release-notes.md $flags

  # Separate from the release steps above: builds the validation pack from the requirements instance and attaches it.
  # Runs only when the secrets REQ_URL and REQ_TOKEN exist. See docs/user-guide/validation-pack.md.
  validation-pack:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach to the GitHub release
      packages: read
    env:
      REQ_URL: ${{ secrets.REQ_URL }}
      REQ_TOKEN: ${{ secrets.REQ_TOKEN }}
    steps:
      - if: ${{ env.REQ_URL != '' && env.REQ_TOKEN != '' }}
        uses: actions/checkout@v4
      - if: ${{ env.REQ_URL != '' && env.REQ_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - if: ${{ env.REQ_URL != '' && env.REQ_TOKEN != '' }}
        name: Build and attach the pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release download "$GITHUB_REF_NAME" --pattern sbom.cdx.json
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          VERSION="$VERSION" IMAGE="$IMAGE" IMAGE_DIGEST="$DIGEST" SBOM=sbom.cdx.json \
            node scripts/validation-pack/validation-pack.ts "validation-pack-$GITHUB_REF_NAME.zip"
          gh release upload "$GITHUB_REF_NAME" "validation-pack-$GITHUB_REF_NAME.zip" --clobber
