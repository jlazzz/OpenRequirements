name: Docs
on:
  push:
    branches: [development]
    paths: [docs/user-guide/**, docs/.vitepress/**, site/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/guide/
      # Landing page at the root, user guide under /guide/.
      - run: mkdir -p _site/guide && cp -r site/. _site/ && cp -r docs/.vitepress/dist/. _site/guide/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
