# Run from the repo root: docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      # The database is reachable only from this machine and the app container. Set POSTGRES_PASSWORD in deploy/.env for real installs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      ATTACHMENTS_DIR: /data/attachments
      # The largest image or evidence file that can be uploaded, in megabytes.
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-25}
      # Set with the https profile (see caddy below): secure cookies, HSTS, and links in emails start with https://DOMAIN.
      DOMAIN: ${DOMAIN:-}
      # Sends email (notifications, password resets, invitations), e.g. smtps://user:pass@smtp.example.com. Unset: no email.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # The address people open the app at, for links in emails. Defaults to https://DOMAIN, or http://localhost:3000.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Sign-in through an OpenID Connect identity provider. All three must be set; the redirect URI is PUBLIC_URL/api/oidc/callback.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # What the sign-in button calls the provider, e.g. "Okta".
      OIDC_NAME: ${OIDC_NAME:-}
      # Encrypts the tokens of Jira, GitHub and GitLab connections. Any long random string; keep it, or tokens must be entered again.
      INTEGRATION_KEY: ${INTEGRATION_KEY:-}
      # true lets webhooks and connections call addresses on private networks, e.g. a Jira inside the company.
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
    volumes:
      # Uploaded images and evidence files. Back this up together with the database.
      - attachments:/data/attachments
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS with automatic certificates from Let's Encrypt. Off unless deploy/.env has COMPOSE_PROFILES=https and DOMAIN set.
  # Ports 80 and 443 must reach this machine from the internet for the certificate to be issued.
  caddy:
    image: caddy:2
    profiles: [https]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates. Losing them means asking Let's Encrypt again, which is rate limited.
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  db-data:
  attachments:
