# Run from the repo root: docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      # The database is reachable only from this machine and the app container. Set POSTGRES_PASSWORD in deploy/.env for real installs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      ATTACHMENTS_DIR: /data/attachments
      # The largest image or evidence file that can be uploaded, in megabytes.
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-25}
    volumes:
      # Uploaded images and evidence files. Back this up together with the database.
      - attachments:/data/attachments
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  attachments:
